<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Evidence gate for mobile-to-HarmonyOS porting</title>
  <desc id="desc">Source behavior, HarmonyOS implementation, and verification evidence must agree before acceptance. Labels stay inside their cards.</desc>
  <rect width="1200" height="500" rx="30" fill="#F8FAFC"/>
  <text x="72" y="72" fill="#0F172A" font-family="Arial, sans-serif" font-size="32" font-weight="700">Accept only when all three sides agree</text>
  <g fill="#EFF6FF" stroke="#60A5FA" stroke-width="5" stroke-linejoin="round">
    <path d="M600 170L320 356L880 356Z"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="455" y="118" width="290" height="96" rx="28" fill="#DBEAFE"/>
    <text x="600" y="158" fill="#1D4ED8" font-size="19" font-weight="700">Source behavior</text>
    <text x="600" y="187" fill="#1E40AF" font-size="15">states · contracts</text>
    <rect x="180" y="308" width="280" height="98" rx="28" fill="#FEF3C7"/>
    <text x="320" y="348" fill="#A16207" font-size="18" font-weight="700">HarmonyOS target</text>
    <text x="320" y="377" fill="#92400E" font-size="15">implementation</text>
    <rect x="740" y="308" width="280" height="98" rx="28" fill="#DCFCE7"/>
    <text x="880" y="348" fill="#166534" font-size="18" font-weight="700">Verification evidence</text>
    <text x="880" y="377" fill="#166534" font-size="15">package · device</text>
    <circle cx="600" cy="290" r="72" fill="#0F172A"/>
    <text x="600" y="283" fill="#FFFFFF" font-size="22" font-weight="700">ACCEPT</text>
    <text x="600" y="312" fill="#CBD5E1" font-size="15">all sides agree</text>
  </g>
  <text x="600" y="464" fill="#B91C1C" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Any missing or conflicting side = BLOCKED / NOT TESTED</text>
</svg>