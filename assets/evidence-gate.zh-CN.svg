<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">移动端到 HarmonyOS 迁移的证据门禁</title>
  <desc id="desc">源端行为、HarmonyOS 实现和验证证据必须一致才可验收；所有文字均位于对应卡片中。</desc>
  <rect width="1200" height="500" rx="30" fill="#F8FAFC"/>
  <text x="72" y="72" fill="#0F172A" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700">仅在三方证据一致时验收</text>
  <g fill="#EFF6FF" stroke="#60A5FA" stroke-width="5" stroke-linejoin="round">
    <path d="M600 170L320 356L880 356Z"/>
  </g>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <rect x="455" y="118" width="290" height="96" rx="28" fill="#DBEAFE"/>
    <text x="600" y="158" fill="#1D4ED8" font-size="19" font-weight="700">源端行为</text>
    <text x="600" y="187" fill="#1E40AF" font-size="15">状态 · 契约</text>
    <rect x="180" y="308" width="280" height="98" rx="28" fill="#FEF3C7"/>
    <text x="320" y="348" fill="#A16207" font-size="18" font-weight="700">HarmonyOS 实现</text>
    <text x="320" y="377" fill="#92400E" font-size="15">调用链 · 状态机</text>
    <rect x="740" y="308" width="280" height="98" rx="28" fill="#DCFCE7"/>
    <text x="880" y="348" fill="#166534" font-size="18" font-weight="700">最终证据</text>
    <text x="880" y="377" fill="#166534" font-size="15">构建 · 测试 · 真机</text>
    <circle cx="600" cy="290" r="72" fill="#0F172A"/>
    <text x="600" y="283" fill="#FFFFFF" font-size="22" font-weight="700">验收</text>
    <text x="600" y="312" fill="#CBD5E1" font-size="15">需三方一致</text>
  </g>
  <text x="600" y="464" fill="#B91C1C" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" text-anchor="middle">任一侧缺失或冲突 = 阻塞 / 未测试</text>
</svg>