<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Staged mobile-to-HarmonyOS porting order</title>
  <desc id="desc">Source snapshot flows to page UI groups, then accepted UI, then functional categories, then verified release evidence.</desc>
  <rect width="1200" height="360" fill="#f8fafc" rx="28"/>
  <text x="72" y="70" fill="#0f172a" font-family="Arial, sans-serif" font-size="31" font-weight="700">Stage the port in the only safe order</text>
  <text x="72" y="108" fill="#475569" font-family="Arial, sans-serif" font-size="19">UI page groups first · functional categories second</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="65" y="170" width="210" height="105" rx="18" fill="#e2e8f0"/>
    <text x="170" y="214" fill="#0f172a" font-size="21" font-weight="700">Source snapshot</text>
    <text x="170" y="244" fill="#475569" font-size="16">assets · states · routes</text>
    <path d="M292 222h70" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <path d="M352 210l18 12-18 12" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="385" y="170" width="210" height="105" rx="18" fill="#dbeafe"/>
    <text x="490" y="214" fill="#1d4ed8" font-size="21" font-weight="700">Phase A · Page UI</text>
    <text x="490" y="244" fill="#1e40af" font-size="16">small groups, exact source fidelity</text>
    <path d="M612 222h70" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <path d="M672 210l18 12-18 12" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="705" y="170" width="210" height="105" rx="18" fill="#fef3c7"/>
    <text x="810" y="214" fill="#a16207" font-size="21" font-weight="700">Phase B · Functions</text>
    <text x="810" y="244" fill="#92400e" font-size="16">one category at a time</text>
    <path d="M932 222h70" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <path d="M992 210l18 12-18 12" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1025" y="170" width="110" height="105" rx="18" fill="#dcfce7"/>
    <text x="1080" y="214" fill="#166534" font-size="21" font-weight="700">Evidence</text>
    <text x="1080" y="244" fill="#166534" font-size="16">release-ready</text>
  </g>
</svg>
